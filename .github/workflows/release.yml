# Builds SyncPlayer.app for Apple silicon and Intel and publishes it as a GitHub Release,
# with the sample kit (movies with sound + ready shows + 使い方.txt) as a second download.
# Run it from the Actions tab ("Run workflow") with a version such as 0.2.0.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.2.0). The release tag is v<version>."
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build universal app
        run: |
          UNIVERSAL=1 VERSION="${{ inputs.version }}" sh tools/make-app.sh dist
          APP=$(ls -d dist/SyncPlayer*.app)
          echo "APP=$APP" >> "$GITHUB_ENV"
      - name: Check the app
        run: |
          lipo -info "$APP/Contents/MacOS/SyncPlayer"
          codesign --verify --verbose "$APP"
      - name: Zip
        run: |
          ZIP="SyncPlayer-${{ inputs.version }}-macOS.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" "$ZIP" "$ZIP.sha256" \
            --target "$GITHUB_SHA" \
            --title "SyncPlayer ${{ inputs.version }}" \
            --notes-file tools/release-notes.md

  samples:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Make the sample kit
        run: |
          DIR="SyncPlayer-サンプル"
          bash tools/make-samples.sh "$DIR"
          cp samples/* "$DIR/"
          ZIP="SyncPlayer-${{ inputs.version }}-samples.zip"
          # Python's zipfile marks the names as UTF-8, so the Japanese names open correctly in Finder.
          python3 -c 'import sys,os,zipfile
          z=zipfile.ZipFile(sys.argv[1],"w",zipfile.ZIP_DEFLATED)
          for r,ds,fs in os.walk(sys.argv[2]):
              for f in sorted(fs): z.write(os.path.join(r,f))
          z.close()' "$ZIP" "$DIR"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ inputs.version }}" "$ZIP"
