# Builds the app on every pull request (no release) and keeps it as a workflow artifact,
# so a fix can be compiled and tried before it is released.
name: build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      # The branch's own commit (not GitHub's merge commit), so the title shows the commit that runs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # No VERSION: the title says "<last release>-dev (commit)" (tools/make-app.sh).
      - name: Build universal app
        run: UNIVERSAL=1 sh tools/make-app.sh dist
      - name: Check the app
        run: |
          lipo -info dist/SyncPlayer.app/Contents/MacOS/SyncPlayer
          codesign --verify --verbose dist/SyncPlayer.app
      - name: Zip
        run: ditto -c -k --keepParent dist/SyncPlayer.app SyncPlayer-pr.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SyncPlayer-pr
          path: SyncPlayer-pr.zip
          retention-days: 14
