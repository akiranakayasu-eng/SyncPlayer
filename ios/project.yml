name: SyncFollower
options:
  projectFormat: xcode15_3
  bundleIdPrefix: com.nakayasu
  deploymentTarget:
    iOS: "16.0"
targets:
  SyncFollower:
    type: application
    platform: iOS
    sources:
      - path: SyncFollower
      - path: SyncFollower/Resources/test.mp4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nakayasu.syncfollower
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SyncFollower
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Follow the SyncPlayer master on this network."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
